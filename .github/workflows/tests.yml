# Runs this repository's own unit tests, then installs the CLI the way a user
# would and lints the repository with it.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    # Pinned on purpose: newer runner images no longer provide Python 3.8 and 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Install the CLI and lint this repository with it
        run: |
          python -m pip install .
          encode-the-correction check
