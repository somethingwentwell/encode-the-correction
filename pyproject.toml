[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "encode-the-correction"
dynamic = ["version"]
description = "Turn every correction you give a coding agent into a deterministic, project-local check."
readme = "README.md"
requires-python = ">=3.8"
# Runtime is the Python standard library only. setuptools is the build backend, nothing more.
dependencies = []
keywords = ["lint", "agents", "AGENTS.md", "pre-commit", "ci"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/somethingwentwell/encode-the-correction"
Repository = "https://github.com/somethingwentwell/encode-the-correction"

[project.scripts]
encode-the-correction = "encode_the_correction:main"

[tool.setuptools]
# One module, listed explicitly: tests/, docs/ and examples/ are never packaged.
py-modules = ["encode_the_correction"]

[tool.setuptools.dynamic]
version = {attr = "encode_the_correction.VERSION"}
